<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENCODER TEST</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="ICONS/apple-touch-icon.png">
<link rel="icon" type="image/png" href="ICONS/icon-192.png">
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--ok:#3fb950;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:1.1rem;letter-spacing:.08em}
#estado{font-size:.8rem;color:var(--dim)}
button{background:var(--acc);color:#04111f;border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:.9rem}
button.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
button:disabled{opacity:.4}
.zrow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
#led{width:64px;height:64px;border-radius:50%;background:#3a1010;border:3px solid #5a1a1a;transition:box-shadow .08s,background .08s;flex:none}
#led.on{background:#ff2b2b;border-color:#ff7b7b;box-shadow:0 0 28px 8px rgba(255,43,43,.75)}
.zrow .t{font-size:1.1rem;font-weight:700}
.zrow .s{font-size:.8rem;color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card .l{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.card .v{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.card.big{grid-column:span 2}
.card.big .v{font-size:3.6rem}
.card .n{font-size:.75rem;color:var(--dim)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stats .card{padding:8px;text-align:center}
.stats .v{font-size:1.3rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
#warn{display:none;background:#3d1d1d;border:1px solid var(--bad);color:#ffb3ae;border-radius:8px;padding:10px;font-size:.85rem;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div><h1>ENCODER TEST</h1><div id="estado">Desconectado</div></div>
  <button id="btnConn">Conectar</button>
</header>
<div id="warn"></div>

<div class="zrow">
  <div id="led"></div>
  <div><div class="t">Z</div><div class="s" id="zinfo">Esperando Z…</div></div>
</div>

<div class="grid">
  <div class="card"><div class="l">A en tiempo real</div><div class="v" id="liveA">0</div><div class="n">desde última Z</div></div>
  <div class="card"><div class="l">B en tiempo real</div><div class="v" id="liveB">0</div><div class="n">desde última Z</div></div>
  <div class="card big"><div class="l">A entre Z (última vuelta)</div><div class="v" id="revA">—</div><div class="n" id="revNote">esperado: 360</div></div>
  <div class="card"><div class="l">B entre Z</div><div class="v" id="revB">—</div><div class="n">esperado: 360</div></div>
  <div class="card"><div class="l">Errores</div><div class="v" id="errs">0</div><div class="n">vueltas ≠ 360 (A o B)</div></div>
</div>

<div class="stats">
  <div class="card"><div class="l">Vueltas</div><div class="v" id="revs">0</div></div>
  <div class="card"><div class="l">Mín A</div><div class="v" id="minA">—</div></div>
  <div class="card"><div class="l">Máx A</div><div class="v" id="maxA">—</div></div>
  <div class="card"><div class="l">Filtro</div><div class="v" id="flt">OFF</div></div>
</div>

<div class="btns">
  <button class="sec" id="btnReset" disabled>Reset estadísticas</button>
  <button class="sec" id="btnFlt" disabled>Filtro glitch ON/OFF</button>
</div>

<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
